<script>// READY72 static training demo. No external services, real credentials, or shared database.
const DATA={"refs":{"emergency":{"title":"UNICEF Emergency Procedures","url":"https://unicef.sharepoint.com/sites/portals/RF/Regulatory%20Framework%20Library/116943_Emergency%20Procedures%20-FINAL%2029Nov.pdf"},"frr":{"title":"UNICEF Financial Regulations and Rules","url":"https://sites.unicef.org/about/execboard/files/2011-ABL8_Regulations_and_Rules-ODS-English.pdf"},"preparedness":{"title":"Guidance on Emergency Preparedness and Response","url":"https://unicef.sharepoint.com/sites/SD/SitePages/Supply-Procedures-and-Guidance-Notes.aspx"},"planning":{"title":"Procedure on Supply Strategy and Planning","url":"https://unicef.sharepoint.com/sites/portals/RF/Regulatory%20Framework%20Library/117351_UNICEF%20Procedure%20on%20Supply%20Strategy%20and%20Planning_v01.pdf"},"sourcing":{"title":"Procedure on Sourcing and Solicitation","url":"https://unicef.sharepoint.com/sites/portals/RF/_layouts/15/viewer.aspx?sourcedoc=%7b6403a4a6-625d-4f57-8c00-086dcf56dc8a%7d"},"contracts":{"title":"Procedure on Contractual Instruments","url":"https://unicef.sharepoint.com/sites/portals/RF/_layouts/15/viewer.aspx?sourcedoc=%7b90ecdbec-8544-4ce3-9b1f-a398db23c526%7d"},"warehouse":{"title":"Procedure on Warehouse and Inventory Management","url":"https://unicef.sharepoint.com/sites/portals/RF/Regulatory%20Framework%20Library/117346_UNICEF%20Procedure%20on%20Warehouse%20and%20Inventory%20Management.pdf"},"transport":{"title":"Procedure on Transportation","url":"https://unicef.sharepoint.com/sites/portals/RF/Regulatory%20Framework%20Library/117349_UNICEF%20Procedure%20on%20Transportation_v01.pdf"},"library":{"title":"Supply Procedures and Guidance Notes","url":"https://unicef.sharepoint.com/sites/SD/SitePages/Supply-Procedures-and-Guidance-Notes.aspx"}},"seedUsers":[{"id":1,"name":"Amina Diallo","email":"amina@unicef.org","profile":"Participant","role":"Supply & Logistics Lead","group":"Kalo CO"},{"id":2,"name":"Jonas Meyer","email":"jonas@unicef.org","profile":"Participant","role":"Programme Lead","group":"Kalo CO"},{"id":3,"name":"Maya Chen","email":"maya@unicef.org","profile":"Participant","role":"Emergency Focal Point","group":"Kalo CO"},{"id":4,"name":"Daniel Okoro","email":"daniel@unicef.org","profile":"Participant","role":"Procurement Lead","group":"Kalo CO"},{"id":5,"name":"Sara Haddad","email":"sara@unicef.org","profile":"Participant","role":"Buyer","group":"Kalo CO"},{"id":6,"name":"Noah Mensah","email":"noah@unicef.org","profile":"Participant","role":"Logistics & Customs","group":"Kalo CO"},{"id":7,"name":"Leila Osman","email":"leila@unicef.org","profile":"Participant","role":"Warehouse & Inventory","group":"Kalo CO"},{"id":8,"name":"Peter Larsen","email":"peter@unicef.org","profile":"Participant","role":"Operations / Finance","group":"Kalo CO"},{"id":9,"name":"Nadia Costa","email":"nadia@unicef.org","profile":"Participant","role":"Management","group":"Kalo CO"},{"id":10,"name":"Omar Rahman","email":"omar@unicef.org","profile":"Participant","role":"Partnerships / Monitoring","group":"Kalo CO"},{"id":11,"name":"RO Support","email":"ro@unicef.org","profile":"Participant","role":"Regional Office","group":"Support Cell"},{"id":12,"name":"SD ECC","email":"ecc@unicef.org","profile":"Participant","role":"Supply Division / ECC","group":"Support Cell"},{"id":13,"name":"Customs Actor","email":"customs@simex.org","profile":"Participant","role":"Government / Customs","group":"Support Cell"},{"id":14,"name":"Partner Actor","email":"partner@simex.org","profile":"Participant","role":"Partner / UN / Market","group":"Support Cell"},{"id":15,"name":"Lead Facilitator","email":"facilitator@unicef.org","profile":"Facilitator","role":"Exercise Director","group":"Exercise Control"},{"id":16,"name":"Observer","email":"observer@unicef.org","profile":"Facilitator","role":"Lead Observer","group":"Exercise Control"}],"stages":[{"id":1,"day":1,"code":"T-30","title":"PREPARE","mins":75,"goal":"Build the Strategy, Supply Plan and preparedness baseline","output":"Draft Emergency S&L Strategy, first-wave Supply Plan and preparedness action list"},{"id":2,"day":2,"code":"T-7","title":"STRESS TEST","mins":70,"goal":"Test whether assumed capacity actually works","output":"Confirmed/conditional/unavailable capacity map and revised plans"},{"id":3,"day":2,"code":"H0","title":"ACTIVATE","mins":60,"goal":"Commit to an executable first 72-hour response","output":"72-hour operational commitment with owners, risks and escalation"},{"id":4,"day":3,"code":"H24","title":"ADAPT","mins":90,"goal":"Use emergency measures and external support correctly","output":"Referenced decision log, support requests and revised commitment"},{"id":5,"day":3,"code":"H72","title":"LEARN","mins":60,"goal":"Convert response evidence into preparedness improvement","output":"AAR and 30/60/90-day improvement plan"}],"missionData":{"1":{"scenario":"Flood and cholera risks may affect 250,000 people within one month. The EPP scenario exists, but the Supply Plan and Emergency Supply & Logistics Strategy have not been tested.","tasks":["Programme and Emergency define who, where, intervention and when.","Supply translates the response into goods, services, quantities and delivery dates.","Procurement and Logistics test stocks, LTAs, markets, routes, customs, storage, partners, funding and staffing.","Management confirms priorities, owners, deadlines and escalation triggers."],"refs":["preparedness","planning"]},"2":{"scenario":"New facts challenge readiness: the main LTA supplier can provide 35%; permits may take seven working days; warehouse capacity is 40% lower; the target population may rise to 90,000.","tasks":["Share private facts across functions.","Mark every assumed capacity CONFIRMED, CONDITIONAL or UNAVAILABLE.","Revise the Strategy and Supply Plan.","Engage Government, partners, RO or SD before impact where needed."],"refs":["planning","transport","warehouse"]},"3":{"scenario":"The emergency occurs and is worse than forecast. Roads are cut, information is incomplete and leadership asks: What can UNICEF deliver in the next 72 hours?","tasks":["Prioritize population, locations and interventions.","Commit only quantities that can be delivered, not merely purchased.","Confirm source, route, customs, receipt, storage and distribution.","Escalate unresolved constraints with owner and latest decision time."],"refs":["emergency","preparedness"]},"4":{"scenario":"A local vendor can deliver urgently; regular competition may delay supply; connectivity is unstable; a verbal offer is received; one commodity may require LPA; freight funding and customs readiness are unresolved.","tasks":["Classify each issue: regular rule, preparedness action or emergency flexibility.","For each flexibility identify conditions, authority, what changes, what remains and required evidence.","Consult the linked procedure and cite it in the decision log.","Request precise RO, SD/ECC, Government or partner support and revise the 72-hour commitment."],"refs":["frr","sourcing","contracts","library"]},"5":{"scenario":"The first 72 hours are complete. Some actions worked; others caused delay. Identify which response decisions should have been completed in preparedness.","tasks":["Classify each bottleneck by root cause.","Identify the preparedness decision that would have prevented it.","Update the Strategy and Supply Plan.","Agree 30/60/90-day actions with owner, deadline and evidence."],"refs":["preparedness","emergency","library"]}},"dayPlan":[{"day":1,"title":"Understand and build","objective":"Create common understanding of preparedness, roles and core products, then build the baseline.","sessions":[{"time":"09:00","type":"Presentation","title":"Why READY72: from risk to standing capacity","mins":30,"say":"Preparedness is not how much stock appears in a report. It is UNICEF's tested ability to release, source, move, receive and account for the response when required.","outcome":"Participants understand the readiness chain and the three time horizons."},{"time":"09:30","type":"Presentation","title":"EPP, CCCs and the emergency supply architecture","mins":45,"say":"Programme defines the anticipated response. Supply and Logistics make that response operationally feasible. The Strategy and Supply Plan connect these two responsibilities.","outcome":"Participants distinguish programme response assumptions, Supply Plan and S&L Strategy."},{"time":"10:30","type":"Workshop","title":"Roles and support map","mins":45,"say":"A Country Office must know what it owns, what it coordinates with Government and partners, and when it needs RO, SD or HQ support.","outcome":"Role map and escalation routes agreed."},{"time":"11:30","type":"SIMEX","title":"Stage 1 — PREPARE","mins":75,"say":"Build a realistic baseline. Do not wait for perfect information; state assumptions and their verification deadlines.","outcome":"Draft Strategy, Supply Plan and preparedness action list."},{"time":"14:00","type":"Debrief","title":"From inventory to standing capacity","mins":45,"say":"What appeared ready but was not tested? Which decisions still depend on Government, partners or support functions?","outcome":"Baseline gaps and learning captured."},{"time":"15:00","type":"Presentation","title":"How procedures work across regular, preparedness and response situations","mins":60,"say":"Emergency measures are specific flexibilities, not a separate control-free procurement system.","outcome":"Participants can classify regular controls, preparedness actions and response flexibilities."}]},{"day":2,"title":"Test and activate","objective":"Stress-test the plan, confront false readiness and produce an executable 72-hour response.","sessions":[{"time":"09:00","type":"Presentation","title":"Supply Plan and Strategy quality clinic","mins":40,"say":"A plan is only useful if quantities, time, locations, source options and logistics assumptions are explicit and testable.","outcome":"Teams improve previous-day products."},{"time":"09:45","type":"SIMEX","title":"Stage 2 — STRESS TEST","mins":70,"say":"Each role holds only part of the truth. Share information and test every capacity claim.","outcome":"Tested capacity map and revised plans."},{"time":"11:15","type":"Debrief","title":"What failed before the emergency?","mins":35,"say":"Did the weakness come from market capacity, planning, roles, coordination, systems or an untested assumption?","outcome":"Root causes distinguished from symptoms."},{"time":"13:00","type":"Presentation","title":"First 72 hours and no-regrets decision-making","mins":45,"say":"No-regrets supports action against reasonably anticipated needs; it does not itself waive funding, authority or procurement requirements.","outcome":"Participants understand first-wave logic and boundaries."},{"time":"14:00","type":"SIMEX","title":"Stage 3 — ACTIVATE","mins":60,"say":"Answer what UNICEF can deliver, not what UNICEF wants to procure.","outcome":"72-hour operational commitment."},{"time":"15:15","type":"Debrief","title":"Executable versus aspirational response","mins":45,"say":"Trace each commitment from source to delivery and identify unsupported assumptions.","outcome":"Commitment corrected and escalation needs defined."}]},{"day":3,"title":"Adapt and institutionalize","objective":"Apply emergency measures, activate support and turn evidence into improvements.","sessions":[{"time":"09:00","type":"Presentation","title":"Emergency procurement decision navigator","mins":55,"say":"For every flexibility answer five questions: when can it be used, what changes, what remains, who decides and what is documented?","outcome":"Participants can navigate FRR and Supply Procedures under time pressure."},{"time":"10:00","type":"SIMEX","title":"Stage 4 — ADAPT","mins":90,"say":"Use procedures as tools. Make targeted support requests and preserve authority, funding and documentation.","outcome":"Decision log, support record and revised commitment."},{"time":"11:45","type":"Debrief","title":"Policy, operations and consequences","mins":45,"say":"Which flexibility was correctly used? Which control protected UNICEF? Which delayed action was actually a preparedness failure?","outcome":"Procedural learning consolidated."},{"time":"13:30","type":"SIMEX","title":"Stage 5 — LEARN","mins":60,"say":"Reverse the response. Identify what should have been decided at T-30 or T-7.","outcome":"AAR and 30/60/90-day plan."},{"time":"14:45","type":"Presentation","title":"Capability evidence and sustaining readiness","mins":40,"say":"An action is complete only when the office can show evidence that the arrangement works.","outcome":"Evidence requirements and follow-up governance agreed."},{"time":"15:30","type":"Closing","title":"Management commitments","mins":30,"say":"Select 3–5 improvements with named owners and review dates. Do not leave with a long unowned list.","outcome":"Priority commitments approved."}]}],"deckContent":{"Why READY72: from risk to standing capacity":[{"title":"From preparedness activity to response capability","body":["Preparedness is the tested ability to deliver the anticipated response when required.","Stock, LTAs and warehouses are inputs; they are not readiness until availability, release, movement and accountability are verified.","READY72 tests the chain before an emergency removes options."],"note":"Open with the practical question: If the emergency started tomorrow morning, what decision would we regret not making today? Do not start with procedures."},{"title":"The readiness chain","body":["Risk and scenario → anticipated programme response","Requirements → Supply Plan + Emergency S&L Strategy","Standing capacity → gaps → preparedness actions","Test → activate → adapt → learn"],"note":"Explain that the exercise follows this exact chain. Programme defines the intended response; Supply & Logistics makes it executable."},{"title":"Three time horizons","body":["0–72 hours: what can actually be released and delivered now?","Days 3–14: what can be replenished, sourced and moved?",">14 days: what capacity must be established or scaled?"],"note":"A large pipeline arriving later does not solve a first-wave gap."},{"title":"Evidence, not confidence","body":["CONFIRMED: verified and usable in the required period","CONDITIONAL: available only if a dependency is resolved","GAP: not available at the required time","NOT TESTED: assumed but not yet verified"],"note":"Example: an LTA exists, but the supplier has not confirmed surge quantity. That capacity is not Confirmed."}],"EPP, CCCs and the emergency supply architecture":[{"title":"Start with the anticipated response","body":["EPP risk analysis and scenarios frame what may happen.","CCCs and programme priorities frame what UNICEF intends to deliver.","Supply & Logistics translates that intent into requirements, sourcing and delivery capacity."],"note":"Do not present Supply planning as an isolated logistics exercise."},{"title":"Two complementary products","body":["Supply Plan: what is needed, how much, when, where and likely source.","Emergency S&L Strategy: how the end-to-end supply chain will make the response feasible.","Both evolve as the scenario, needs and operating environment change."],"note":"Ask the room to explain the difference before correcting."},{"title":"One operating system","body":["Country Office owns preparedness and response delivery.","Government and partners are part of the operating environment.","RO, Supply Division/ECC and HQ complement CO capacity when needs exceed local capability."],"note":"'Please support urgently' is not an actionable escalation."},{"title":"Preparedness decision","body":["What must be decided before impact?","What must be tested rather than assumed?","What requires Government or partner engagement now?","What support should be pre-arranged with RO/SD/HQ?"],"note":"Transition into the Roles and Support Map workshop."}],"Roles and support map":[{"title":"Build the response around decisions","body":["Who defines the requirement?","Who provides technical and market input?","Who holds authority and funding?","Who plans movement, receipt, storage and delivery?","Who must be engaged outside the CO?"],"note":"The objective is to expose critical hand-offs, not create a static RACI."},{"title":"Country Office roles","body":["Programme/Emergency: response assumptions, priorities and requirements.","Supply/Procurement: feasibility, sourcing, procurement route and contracting.","Logistics/Warehouse: route, customs, receipt, storage, handover and inventory.","Operations/Management: authority, funding, prioritization and risk decisions."],"note":"Assign exercise roles at this point."},{"title":"Support architecture","body":["Government: access, permits, national capacity and regulatory readiness.","Partners/UN: distribution, shared services and complementary capacity.","RO: assurance, coordination, surge and escalation.","Supply Division/ECC/HQ: global sourcing, technical centres, emergency stock and specialized support."],"note":"Ask each role to name one support relationship that should exist before an emergency."},{"title":"Workshop output","body":["Decision/issue","Primary owner","Who must be consulted","Escalation trigger","Support actor","Latest useful decision time"],"note":"Participants create a working map, not just discuss it."}],"How procedures work across regular, preparedness and response situations":[{"title":"One regulatory framework, different operating conditions","body":["Regular procedures remain the baseline.","Preparedness uses the regular framework early to reduce response-time constraints.","Emergency response may activate specific, authorized flexibilities where their conditions are met."],"note":"An emergency is not a separate control-free procurement system."},{"title":"Preparedness removes avoidable delay","body":["Validate requirements and technical capacity.","Assess markets and LTA surge capacity.","Resolve likely LPA needs.","Prepare customs, warehousing, transport and partner capacity.","Clarify authority, funding and support arrangements."],"note":"Which emergency problems are actually failures to use normal procedures early enough?"},{"title":"Emergency flexibility test","body":["When can it be used?","What exactly changes?","What remains mandatory?","Who decides or approves?","What must be documented?"],"note":"This test becomes the Decision Navigator logic on Day 3."},{"title":"Controls that do not disappear","body":["Delegated authority and availability of funds","Vendor eligibility and due diligence","Applicable review and approval requirements","Documented procurement/contracting basis","Accountability for receipt and inventory"],"note":"Use the FRR as the control anchor, then show where Supply procedures provide the operational rule."}],"Supply Plan and Strategy quality clinic":[{"title":"A plan must be testable","body":["Quantity without timing hides readiness gaps.","Source without confirmed capacity is an assumption.","Delivery date without route/customs/receipt readiness is aspirational.","Every critical assumption needs an owner and verification deadline."],"note":"Use Day 1 products as examples."},{"title":"Supply Plan quality check","body":["Requirement and programme purpose","Quantity and required delivery date","Location and delivery point","Specification and technical/LPA needs","Source options and lead time","Funding and owner"],"note":"Give participants five minutes to find what is missing in their own plan."},{"title":"Strategy quality check","body":["Sourcing and market capacity","Transport corridors, entry points and customs","Warehousing, cold chain and distribution","People, systems and information","Government/partner coordination","Risks, triggers and support arrangements"],"note":"The Strategy explains how the Supply Plan will be made executable."},{"title":"Stress-test question","body":["Is it available?","Can UNICEF access/release it?","Can it move in time?","Can it clear and be received?","Can it be stored, distributed and accounted for?"],"note":"Tell participants that different roles will now receive different facts."}],"First 72 hours and no-regrets decision-making":[{"title":"The first-wave question","body":["Ask: What can UNICEF deliver in the next 72 hours?","Do not ask only: What can UNICEF order?","Commitments must connect source to final delivery readiness."],"note":"Central learning message before ACTIVATE."},{"title":"No-regrets in operational terms","body":["Plan and mobilize against the reasonably anticipated scale of the response, not only confirmed needs.","Accept that some mobilized capacity may later prove unnecessary.","No-regrets does not itself change authority, funding or procurement requirements."],"note":"Keep no-regrets separate from procurement exceptions such as FRR Rule 112.30(c)."},{"title":"Build an executable 72-hour commitment","body":["Population / intervention / location","Requirement and quantity","Available source","Route and customs","Receipt/storage/distribution","Owner, risk and escalation"],"note":"Smaller but executable beats ambitious but unsupported."},{"title":"Escalate decisions, not problems","body":["What is blocked?","What exact decision/capacity is required?","Why can the CO not resolve it?","By when is support still useful?","What happens if it is delayed?"],"note":"Use this structure for RO/SD/Government support requests."}],"Emergency procurement decision navigator":[{"title":"Do not memorize 34 procedures","body":["Start from the operational decision.","Navigate to the controlling procedure.","Apply the five-question flexibility test.","Record the authority and evidence in the decision log."],"note":"The goal is confident navigation, not closed-book recall."},{"title":"FRR Rule 112.30(c)","body":["Emergency situations or exigencies may justify departure from regular competition when delay cannot be accommodated.","The reasons must be recorded in writing.","The rule concerns competition; it does not waive funding, authority or contracting requirements."],"note":"Challenge 'emergency = direct contract'. Require the actual basis."},{"title":"Typical emergency decisions","body":["Competition / single-source solicitation","Solicitation period and exceptional verbal offers","Vendor registration and due diligence","CRC review","Contractual instrument and LTA","Transport / customs / warehouse readiness"],"note":"The exact answer remains in the source procedure."},{"title":"Decision record","body":["Decision","Why / evidence","Authority / reference","Approver / reviewer","Owner and deadline","Operational consequence / residual risk"],"note":"Participants must cite procedures in their decision log during ADAPT."}],"Capability evidence and sustaining readiness":[{"title":"Evidence changes the conversation","body":["Do not ask: Are we ready?","Ask: What evidence shows this arrangement works?","Confirmed capacity requires verification, ownership and a current date."],"note":"Use evidence captured in the simulation."},{"title":"Classify what happened","body":["Capability demonstrated","Knowledge gap","Preparedness/planning gap","Coordination or role gap","System/data gap","Market/capacity gap"],"note":"Organizational learning, not individual performance scoring."},{"title":"From finding to action","body":["Gap","Corrective action","Owner","Deadline","Evidence of completion","Re-test date"],"note":"Evidence must be concrete: signed protocol, vendor confirmation, tested route, approved plan."},{"title":"Sustain readiness","body":["30 days: close urgent gaps","60 days: test arrangements","90 days: demonstrate sustained readiness","Feed lessons back into EPP, Strategy and Supply Plan"],"note":"Transition to management commitments."}],"Management commitments":[{"title":"Close with choices, not a long list","body":["Select 3–5 priority improvements.","Name one accountable owner for each.","Set a review date.","Define the evidence that will prove readiness."],"note":"Do not allow every recommendation to be called a priority."},{"title":"What READY72 should leave behind","body":["Updated Emergency S&L Strategy","Tested Supply Plan","Standing-capacity evidence","Decision/support logs","AAR","30/60/90-day improvement plan"],"note":"Exercise products become preparedness inputs after the training."},{"title":"Final question","body":["What decision will UNICEF make now, while options still exist, rather than during the next emergency?"],"note":"End with owners and dates visibly confirmed."}]}};

function scenarios(){let selected=state.scenarios.find(s=>s.id===scenarioId)||state.scenarios[0];return `${heading('Scenario builder','Amend or activate a scenario for a particular READY72 stage.')}<div class="two-pane"><div>${card('Select scenario',state.scenarios.map(s=>`<div class="choice"><div><strong>${e(s.name)}</strong><small>Stage ${e(s.stage||'Standalone')} · ${e(s.status)}</small></div>${btn('Edit','scenario-select',`data-id="${s.id}"`,'tiny '+(selected.id===s.id?'primary':''))}</div>`).join('')+`<div class="field"><label for="new-scenario-name">Add custom scenario</label><input id="new-scenario-name" placeholder="Scenario name"></div>${btn('Add scenario','scenario-add','','secondary')}`)}</div><div>${card('Edit scenario',`<div class="field"><label for="scenario-name">Name</label><input id="scenario-name" value="${e(selected.name)}"></div><div class="field"><label for="scenario-stage">Linked stage</label><select id="scenario-stage"><option value="">Standalone</option>${DATA.stages.map(s=>`<option value="${s.id}" ${selected.stage===s.id?'selected':''}>${e(s.code)} · ${e(s.title)}</option>`).join('')}</select></div><div class="field"><label for="scenario-summary">Scenario participants receive</label><textarea rows="7" id="scenario-summary">${e(selected.summary)}</textarea></div><div class="field"><label for="scenario-tasks">Participant actions (one per line)</label><textarea rows="8" id="scenario-tasks">${e(selected.tasks.join('\n'))}</textarea></div><div class="field"><label for="scenario-refs">Reference links (Ctrl-click to select multiple)</label><select id="scenario-refs" multiple size="6">${Object.entries(DATA.refs).map(([k,v])=>`<option value="${e(k)}" ${selected.refs.includes(k)?'selected':''}>${e(v.title)}</option>`).join('')}</select></div><div class="actions">${btn('Save changes','scenario-save','','secondary')}${btn('Save and activate','scenario-activate','','success')}${btn('Duplicate','scenario-duplicate','','tiny')}</div><p class="fine">Activating a scenario pauses other active scenarios linked to the same stage.</p>`)}</div></div>`}
function groups(){return `${heading('Groups & roles','Configure the demonstration cohort and assign exercise roles.')}<div class="grid cols2">${card('Add a group',`<div class="field"><label for="group-name">Group name</label><input id="group-name" placeholder="Country Office B"></div>${btn('Add group','group-add','','primary')}`)}${card('Add a participant',`<div class="field"><label for="new-user-name">Name</label><input id="new-user-name" placeholder="Full name"></div><div class="field"><label for="new-user-role">Exercise role</label><input id="new-user-role" placeholder="Supply / Logistics"></div><div class="field"><label for="new-user-group">Group</label><select id="new-user-group">${state.groups.map(g=>`<option>${e(g)}</option>`).join('')}</select></div>${btn('Add participant','user-add','','primary')}`)}</div><div class="grid cols2">${state.groups.map(g=>card(e(g),`<p class="small">${state.users.filter(u=>u.group===g).length} assigned roles</p>${state.users.filter(u=>u.group===g).map(u=>`<div class="cardline"><strong>${e(u.name)}</strong><div class="small muted">${e(u.role)} · ${e(u.profile)}</div><div class="actions">${btn('Remove','user-remove',`data-id="${u.id}"`,'danger tiny')}</div></div>`).join('')}`)).join('')}</div>`}
function curriculum(){let plan=DATA.dayPlan.find(x=>x.day===day),session=sessionIndex===null?null:plan.sessions[sessionIndex];if(session){let slides=DATA.deckContent[session.title]||[{title:session.title,body:[session.say,'Expected outcome: '+session.outcome],note:'Link the discussion to the next exercise or debrief.'},{title:'Apply the learning',body:['What does this mean for the Country Office?','What decisions should already exist before an emergency?'],note:'Capture example decisions.'}],sl=slides[slideIndex]||slides[0];return `${heading('Facilitator presentation',e(session.title))}${btn('← Back to day plan','session-close','','secondary')}<div style="height:12px"></div><div class="slide"><small>READY72 · DAY ${day} · SLIDE ${slideIndex+1} OF ${slides.length}</small><h2>${e(sl.title)}</h2><ul>${sl.body.map(b=>`<li>${e(b)}</li>`).join('')}</ul></div>${showNotes?`<div class="slide-notes"><b>Speaker notes</b><p>${e(sl.note)}</p></div>`:''}<div class="actions">${btn('Previous','slide-prev',slideIndex===0?'disabled':'','secondary')}${btn('Next','slide-next',slideIndex===slides.length-1?'disabled':'','primary')}${btn(showNotes?'Hide notes':'Show speaker notes','toggle-notes')}</div>`}
return `${heading('3-day facilitator curriculum','Present, practice, simulate and debrief using the supplied READY72 curriculum.')}<div class="tabs">${DATA.dayPlan.map(x=>btn('Day '+x.day,'day',`data-day="${x.day}"`,day===x.day?'selected':'')).join('')}</div>${card('Day '+day+' — '+e(plan.title),`<p>${e(plan.objective)}</p>`)}${plan.sessions.map((s,i)=>card(e(s.time)+' · '+e(s.title),`<span class="tag">${e(s.type)}</span> <span class="tag">${s.mins} min</span><div class="grid cols2" style="margin-top:15px"><div class="rolebox"><b>Facilitator introduction</b><p class="small">${e(s.say)}</p></div><div class="rolebox"><b>Expected outcome</b><p class="small">${e(s.outcome)}</p></div></div><div class="actions">${btn('Open presentation','session-open',`data-index="${i}"`,'primary')}</div>`)).join('')}`}
function messages(){const u=user(),visible=state.messages.filter(m=>isFac()||m.to===u.group||m.to===u.name||m.from===u.id);return `${heading('Exercise messages','Record role hand-offs, actor responses and requests for support.')}<div class="two-pane"><div>${card('Compose a message',`<div class="field"><label for="msg-to">Recipient</label><select id="msg-to">${[...state.groups,...state.users.filter(x=>x.id!==u.id).map(x=>x.name)].map(x=>`<option ${x===u.group?'selected':''}>${e(x)}</option>`).join('')}</select></div><div class="field"><label for="msg-subject">Subject</label><input id="msg-subject" placeholder="Decision needed / support request"></div><div class="field"><label for="msg-body">Message</label><textarea rows="9" id="msg-body" placeholder="State what is blocked, decision requested, owner and latest useful time."></textarea></div>${btn('Send locally','message-send','','primary')}<p class="fine">This simulated mailbox does not send emails or messages to other devices.</p>`)}</div><div>${card('Local mailbox',visible.length?visible.slice().reverse().map(m=>`<div class="cardline"><b>${e(m.subject||'No subject')}</b><p class="fine">From ${e(state.users.find(x=>x.id===m.from)?.name||'Unknown')} · To ${e(m.to)} · ${e(m.time)}</p><p>${e(m.body)}</p></div>`).join(''):'<div class="empty">No messages recorded.</div>')}</div></div>`}
function docs(){const samples=[{name:'Country_Scenario_Brief.txt',body:DATA.missionData[1].scenario},{name:'Supply_Plan_Template.csv',body:'Requirement,Intervention,Quantity,Unit,Destination,Required date,Source option,Lead time,Capacity status,Funding,Owner,Risk\n'},{name:'Emergency_SL_Strategy_Template.txt',body:'EMERGENCY SUPPLY AND LOGISTICS STRATEGY\n1. Risk and response scenario\n2. Programme requirements and supply plan linkage\n3. Procurement and market/supplier capacity\n4. Stocks, warehousing and inventory\n5. Transport, customs, access and distribution\n6. People, partners, government and surge support\n7. Risks, assumptions and triggers\n8. Actions with owners, dates and evidence\n'}];return `${heading('Exercise documents','Download working templates and maintain a browser-local document list.')}<div class="panel"><h2>Working templates</h2>${samples.map((d,i)=>`<div class="doc-row"><div><b>${e(d.name)}</b><small>Training template · available to all groups</small></div>${btn('Download','doc-download',`data-index="${i}"`,'tiny secondary')}</div>`).join('')}</div>${card('Upload small exercise file',`<p class="small muted">For practice only. Uploaded files are saved only in this browser (up to 300 KB per file), and cannot be shared across devices.</p><div class="field"><label for="doc-input">Choose a document</label><input type="file" id="doc-input" accept=".txt,.csv,.json,.pdf,.docx,.xlsx" /></div><div class="actions">${btn('Save to this browser','doc-upload','','primary')}</div>`)}${card('Saved local files',state.docs.length?state.docs.map((d,i)=>`<div class="doc-row"><div><b>${e(d.name)}</b><small>${e(d.owner)} · ${e(d.group)} · ${e(d.date)}</small></div>${btn('Download','uploaded-download',`data-index="${i}"`,'tiny')}</div>`).join(''):'<div class="empty">No files uploaded in this browser.</div>')}`}
function references(){return `${heading('Decision Navigator','Consult the relevant procedure and document the operational basis of the decision.')}<div class="grid cols2">${Object.values(DATA.refs).map(r=>card(e(r.title),`<p class="small">Reference link from the original READY72 source.</p><a href="${e(r.url)}" target="_blank" rel="noopener noreferrer">Open procedure or guidance ↗</a>`)).join('')}</div>${card('Five-question flexibility test',`<div class="grid cols3">${['When can it be used?','What changes?','What remains mandatory?','Who decides or approves?','What must be documented?'].map((q,i)=>`<div class="metric"><span class="tag">${i+1}</span><h3>${e(q)}</h3></div>`).join('')}</div><p class="fine">Links may require UNICEF authorization and must be verified against current applicable procedures.</p>`)}`}
function fileDownload(name,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const seedDoc=i=>[{name:'Country_Scenario_Brief.txt',body:DATA.missionData[1].scenario},{name:'Supply_Plan_Template.csv',body:'Requirement,Intervention,Quantity,Unit,Destination,Required date,Source option,Lead time,Capacity status,Funding,Owner,Risk\n'},{name:'Emergency_SL_Strategy_Template.txt',body:'EMERGENCY SUPPLY AND LOGISTICS STRATEGY\n1. Risk and response scenario\n2. Programme requirements and supply plan linkage\n3. Procurement and market/supplier capacity\n4. Stocks, warehousing and inventory\n5. Transport, customs, access and distribution\n6. People, partners, government and surge support\n7. Risks, assumptions and triggers\n8. Actions with owners, dates and evidence\n'}][i];
function act(name,button){const d=button.dataset;switch(name){
case 'enter':{const u=state.users.find(x=>d.role==='fac'?x.profile==='Facilitator':d.role==='observer'?x.role==='Lead Observer':x.profile==='Participant');userId=u?.id||state.users[0].id;screen='home';break}
case 'enter-selected':userId=Number($('choose-user').value);screen='home';break;
case 'logout':userId=null;screen='home';break;
case 'nav':screen=d.name;sessionIndex=null;break;
case 'stage':stageId=Number(d.stage);screen='exercise';break;
case 'release':{let id=Number(d.stage);state.released=state.released.includes(id)?state.released.filter(x=>x!==id):[...state.released,id];save();notify('Stage availability updated in this browser.');break}
case 'draft':case 'submit':{let text=$('output-editor')?.value.trim();if(!text){notify('Enter your group decision before saving.');return}const key=stageId+':'+user().group;state.outputs[key]={...state.outputs[key],text,status:name==='submit'?'Submitted':'Draft',updatedAt:new Date().toISOString(),submittedAt:name==='submit'?new Date().toISOString():state.outputs[key]?.submittedAt,submittedBy:user().name,group:user().group,stage:stageId};save();notify(name==='submit'?'Local submission recorded.':'Draft saved on this device.');break}
case 'review-select':reviewKey=d.key;break;
case 'review-return':case 'review-accept':{if(!state.outputs[reviewKey])return;const status=name==='review-accept'?'Accepted':'Returned for revision';state.feedback[reviewKey]={status,comment:$('review-comment')?.value||'',reviewedBy:user().name,date:new Date().toISOString()};state.outputs[reviewKey].status=status;save();notify('Feedback saved locally.');break}
case 'task-complete':{let t=state.tasks.find(x=>x.id===Number(d.id));if(t)t.status='Complete';save();break}
case 'transfer-task':{let t=state.tasks.find(x=>x.id===Number(d.id)),id=Number($('transfer-'+d.id)?.value);if(!id){notify('Choose a recipient first.');return}if(t){t.owner=id;t.status='Transferred'}save();break}
case 'day':day=Number(d.day);sessionIndex=null;break;
case 'session-open':sessionIndex=Number(d.index);slideIndex=0;showNotes=false;break;
case 'session-close':sessionIndex=null;break;
case 'slide-next':slideIndex++;break;
case 'slide-prev':slideIndex=Math.max(0,slideIndex-1);break;
case 'toggle-notes':showNotes=!showNotes;break;
case 'scenario-select':scenarioId=Number(d.id);break;
case 'scenario-add':{let n=$('new-scenario-name')?.value.trim();if(!n){notify('Enter a scenario name.');return}let id=Math.max(0,...state.scenarios.map(x=>x.id))+1;state.scenarios.push({id,name:n,stage:null,status:'Draft',summary:'Describe the scenario received by participants.',tasks:['Agree actions, owners and due dates.'],refs:['library']});scenarioId=id;save();break}
case 'scenario-save':case 'scenario-activate':{let s=state.scenarios.find(x=>x.id===scenarioId);s.name=$('scenario-name').value.trim()||s.name;s.summary=$('scenario-summary').value.trim();s.stage=$('scenario-stage').value?Number($('scenario-stage').value):null;s.tasks=$('scenario-tasks').value.split('\n').map(t=>t.trim()).filter(Boolean);s.refs=Array.from($('scenario-refs').selectedOptions,x=>x.value);if(name==='scenario-activate'){if(s.stage)for(let x of state.scenarios)if(x.stage===s.stage)x.status='Paused';s.status='Active'}save();notify(name==='scenario-activate'?'Scenario activated locally.':'Scenario saved.');break}
case 'scenario-duplicate':{let s=state.scenarios.find(x=>x.id===scenarioId),id=Math.max(...state.scenarios.map(x=>x.id))+1;state.scenarios.push({...structuredClone(s),id,name:s.name+' (copy)',status:'Draft'});scenarioId=id;save();break}
case 'group-add':{let n=$('group-name')?.value.trim();if(!n||state.groups.includes(n)){notify('Enter a new group name.');return}state.groups.push(n);save();break}
case 'user-add':{let n=$('new-user-name')?.value.trim(),role=$('new-user-role')?.value.trim();if(!n||!role){notify('Enter a name and role.');return}let id=Math.max(...state.users.map(u=>u.id))+1;state.users.push({id,name:n,email:'',profile:'Participant',role,group:$('new-user-group').value});save();break}
case 'user-remove':{let id=Number(d.id);if(id===userId){notify('You cannot remove the active facilitator.');return}if(!confirm('Remove this sample role from the local demo?'))return;state.users=state.users.filter(u=>u.id!==id);save();break}
case 'message-send':{let body=$('msg-body')?.value.trim();if(!body){notify('Enter a message first.');return}state.messages.push({id:Date.now(),from:userId,to:$('msg-to').value,subject:$('msg-subject').value.trim(),body,time:new Date().toLocaleString()});save();notify('Message saved locally.');break}
case 'doc-download':{let doc=seedDoc(Number(d.index));fileDownload(doc.name,doc.body,doc.name.endsWith('.csv')?'text/csv':'text/plain');return}
case 'doc-upload':{let f=$('doc-input')?.files?.[0];if(!f){notify('Choose a file first.');return}if(f.size>300000){notify('Maximum demo file size is 300 KB.');return}let reader=new FileReader();reader.onload=()=>{state.docs.push({name:f.name,data:reader.result,owner:user().name,group:user().group,date:new Date().toLocaleDateString()});save();render();notify('File saved in this browser.');};reader.onerror=()=>notify('Cannot read the selected file.');reader.readAsDataURL(f);return}
case 'uploaded-download':{let doc=state.docs[Number(d.index)];if(!doc)return;let a=document.createElement('a');a.href=doc.data;a.download=doc.name;a.click();return}
case 'export':fileDownload('READY72-local-backup.json',JSON.stringify(state,null,2),'application/json');return;
case 'reset':if(!confirm('Reset all locally saved READY72 demonstration data? This cannot be undone.'))return;state=defaultState();save();userId=null;screen='home';break;
default:return;
}render()}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;try{act(button.dataset.action,button)}catch(err){console.error(err);notify('Action failed: '+err.message)}});
render();
</script></body></html>
